[package]
name = "fred-markets"
version = "0.1.0"
description = "FREDmarkets prediction market platform on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fred_markets"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
blake3 = { workspace = true }
bytemuck = { version = "1.14", features = ["derive"] }
